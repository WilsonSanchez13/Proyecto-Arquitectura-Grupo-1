spring.application.name=activedirectory
server.port=${AD_PORT:8200}

# Base de datos propia del directorio. Por defecto H2 en archivo (persiste entre reinicios).
# Para PostgreSQL define AD_DB_URL, AD_DB_USER y AD_DB_PASSWORD.
spring.datasource.url=${AD_DB_URL:jdbc:h2:file:./data/directorio}
spring.datasource.username=${AD_DB_USER:sa}
spring.datasource.password=${AD_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Clave compartida con el monolito (cabecera X-Api-Key). Cámbiala en el despliegue.
ad.api-key=${AD_API_KEY:clave-ad-2026}
# Crea el usuario de prueba cliente / 1234 si no existe.
ad.sembrar-prueba=${AD_SEMBRAR_PRUEBA:true}
