# Formato de log para ver qué instancia atendió cada petición.
log_format balanceo '$remote_addr [$time_local] "$request" $status upstream=$upstream_addr tiempo=$upstream_response_time';

# Entrada pública de la M1 (perímetro): Angular y /api hacia el ApiGateway.
server {
    listen 8080;
    server_name _;

    root /var/www/ssofront;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }
}

# Balanceador interno: solo escucha en localhost y lo usa el ApiGateway.
server {
    listen 127.0.0.1:8090;
    server_name _;

    access_log /var/log/nginx/balanceo.log balanceo;

    location /api/ {
        proxy_pass http://mssso_m2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        add_header X-Servidor $upstream_addr always;
        error_page 502 503 504 = @servicio_caido;
    }

    location @servicio_caido {
        default_type application/json;
        return 502 '{"mensaje":"El servicio no está disponible en este momento. Intenta de nuevo en unos minutos."}';
    }
}
